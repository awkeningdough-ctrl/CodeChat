<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f1216;
    --panel: #171b21;
    --paper: #ece6d6;
    --paper-dim: #8a8577;
    --amber: #e8a33d;
    --amber-dim: #7a5a26;
    --alert: #c1443c;
    --line: #2a3038;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--ink); color: var(--paper);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
  }
  body { display: flex; flex-direction: column; overflow: hidden; }

  /* faint scanline sweep -- one deliberate motion moment, disabled under reduced-motion */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: linear-gradient(180deg, transparent 0%, rgba(232,163,61,0.035) 50%, transparent 100%);
    background-size: 100% 240px;
    animation: sweep 9s linear infinite;
  }
  @keyframes sweep { 0% { background-position: 0 -240px; } 100% { background-position: 0 100vh; } }
  @media (prefers-reduced-motion: reduce) { body::before { animation: none; } }

  .bar {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
    flex-shrink: 0;
  }
  .brand {
    font-weight: 700; letter-spacing: 3px; font-size: 14px; color: var(--paper);
    display: flex; align-items: center; gap: 10px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--paper-dim);
    box-shadow: none; transition: background .3s, box-shadow .3s;
  }
  .dot.live { background: var(--amber); box-shadow: 0 0 6px 1px var(--amber); animation: pulse 2s infinite; }
  .dot.down { background: var(--alert); box-shadow: 0 0 6px 1px var(--alert); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  .status-text { font-size: 11px; color: var(--paper-dim); letter-spacing: 1px; margin-left: 2px; }
  .clock { font-size: 12px; color: var(--paper-dim); letter-spacing: 1px; }

  .console {
    display: flex; gap: 1px; background: var(--line); flex-shrink: 0;
  }
  .channel-block {
    flex: 1; background: var(--panel); padding: 14px 20px;
  }
  .channel-block label {
    display: block; font-size: 10px; letter-spacing: 2px; color: var(--paper-dim);
    margin-bottom: 8px; font-weight: 600;
  }
  .code-display input, .code-entry input {
    width: 100%; background: var(--ink); border: 1px solid var(--line); color: var(--amber);
    font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 20px;
    letter-spacing: 8px; padding: 10px 12px; border-radius: 3px;
    background-image: repeating-linear-gradient(90deg, transparent, transparent calc(16.6% - 1px), var(--line) calc(16.6% - 1px), var(--line) 16.6%);
  }
  .code-entry { display: flex; gap: 8px; }
  .code-entry input {
    color: var(--paper); text-transform: uppercase;
  }
  .code-entry input::placeholder { color: var(--paper-dim); letter-spacing: 4px; }
  .code-entry input:focus, .code-display input:focus {
    outline: none; border-color: var(--amber);
  }
  .channel-block button {
    background: transparent; border: 1px solid var(--amber-dim); color: var(--amber);
    font-family: inherit; font-weight: 600; letter-spacing: 2px; font-size: 11px;
    padding: 0 16px; border-radius: 3px; cursor: pointer; white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  .channel-block button:hover { background: rgba(232,163,61,0.1); border-color: var(--amber); }
  .channel-block button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .log {
    flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 3px;
    font-size: 13px; line-height: 1.6;
  }
  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .line { display: flex; gap: 10px; }
  .line .ts { color: var(--paper-dim); flex-shrink: 0; }
  .line .marker { flex-shrink: 0; width: 16px; }
  .line.mine .marker, .line.mine .body { color: var(--amber); }
  .line.theirs .marker, .line.theirs .body { color: var(--paper); }
  .line.system { color: var(--paper-dim); font-style: italic; }
  .line.system .marker { color: var(--paper-dim); }

  .keyline {
    display: flex; align-items: center; gap: 10px; padding: 12px 20px;
    border-top: 1px solid var(--line); background: var(--panel); flex-shrink: 0;
  }
  .keyline .caret { color: var(--amber); font-weight: 700; }
  .keyline input {
    flex: 1; background: transparent; border: none; color: var(--paper);
    font-family: inherit; font-size: 14px; caret-color: var(--amber);
  }
  .keyline input:focus { outline: none; }
  .keyline input::placeholder { color: var(--paper-dim); }
  .keyline button {
    background: var(--amber); border: none; color: var(--ink); font-family: inherit;
    font-weight: 700; letter-spacing: 2px; font-size: 12px; padding: 9px 18px;
    border-radius: 3px; cursor: pointer;
  }
  .keyline button:hover { filter: brightness(1.1); }
  .keyline button:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

  @media (max-width: 640px) {
    .console { flex-direction: column; }
    .code-display input, .code-entry input { font-size: 16px; letter-spacing: 4px; }
  }
</style>
</head>
<body>

<header class="bar">
  <div class="brand"><span class="dot" id="statusDot"></span>CODECHAT<span class="status-text" id="myIdBadge">connecting…</span></div>
  <div class="clock" id="clock">--:--:--Z</div>
</header>

<section class="console">
  <div class="channel-block">
    <label>Your channel — share with a peer</label>
    <div class="code-display"><input id="myIdField" readonly></div>
  </div>
  <div class="channel-block">
    <label>Peer channel</label>
    <div class="code-entry">
      <input id="peerIdField" placeholder="——————" maxlength="6">
      <button id="connectBtn">CONNECT</button>
    </div>
  </div>
</section>

<div class="log" id="messages"></div>

<div class="keyline">
  <span class="caret">›</span>
  <input id="msgInput" placeholder="type message" autocomplete="off">
  <button id="sendBtn">SEND</button>
</div>

<script src="app.js"></script>
</body>
</html>
